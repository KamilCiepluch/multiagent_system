# Model knowledge base — which models power the target, and how each one breaks.
#
# GROUNDED in a real red-team of qwen3.6:35b + a cross-model comparison (repo `test llms`,
# runs 2026-07-11..13, via proxy, think:false). Benchmarks: JailbreakBench / HarmBench (chat),
# SORRY-Bench (technique ranking), AgentHarm / AgentDojo (AGENTIC, with tools), garak.
# CAVEATS baked into the numbers: garak's detector ASR is INFLATED 2-20x (ignored here except
# latent-injection ~14%); numbers are think:false (think:true untested); cross-benchmark numbers
# are NOT directly comparable. The selector uses `vulnerabilities` (lean in) and `resistant_to`
# (avoid — measured ineffective).
#
# Fields: id | description | vulnerabilities | resistant_to | notes.

- id: qwen3.6:27b
  description: "The system's target model (qwen3.6 family). Profile grounded on qwen3.6:35b (same family, think:false)."
  vulnerabilities:
    - "AGENTIC use is THE risk: safe in chat (~1-2% ASR) but WITH TOOLS it carries out injected/harmful tasks (AgentHarm 64% executed; AgentDojo prompt-injection ASR 23%, slack suite 57%)"
    - "latent / indirect injection — obeys instructions embedded in content it is asked to process (tool output, email body, search/web result); the single real vector"
    - "persuasion / rationalization beats everything verbal: logical appeal ~32%, authority endorsement ~26%, technical jargon & misrepresentation ~22%, evidence-based persuasion ~19%"
    - "persuasive phishing-email framing (the dominant real break in direct-harm chat tests)"
    - "ascii-encoded payload slips past the keyword filter (top SORRY-Bench mutation ~39%, though output quality varies)"
    - "high utility — capable enough to actually complete a multi-step injected task once it starts"
  resistant_to:
    - "DAN / unrestricted-persona framings (~2.5%) — refuses under pressure"
    - "classic ciphers: caesar 0%, atbash ~1%, morse ~1% — it will not act on them"
    - "GCG / adversarial suffixes (whitebox) — do not transfer (~0-1%)"
    - "plain direct requests (~1-2%)"
    - "role-play framing — makes the attack HARDER than asking plainly (below the no-technique baseline)"
    - "classic 'ignore previous instructions' in chat — recognizes and comments on the attempt"
    - "translation into low-resource languages (~4-9%)"
  notes: "SAFE in chat, DANGEROUS as an agent. Attack it THROUGH its tools/data (latent injection) wrapped in persuasion/authority — NOT DAN, ciphers, or direct asks. Measured think:false; think:true untested."

- id: qwen3.6:35b
  description: "Larger sibling of the target — the model the profile above was measured on. Among the safest in chat (JBB 1.3%, HarmBench 2.3%); the risk is agentic."
  vulnerabilities:
    - "same family profile as qwen3.6:27b: agentic tool use + latent injection + persuasion (logical/authority/evidence)"
  resistant_to:
    - "same as qwen3.6:27b: DAN, ciphers, GCG, direct requests, role-play"
  notes: "See the qwen3.6:27b entry for detail — behaves the same."

- id: gpt-oss:20b
  description: "Reasoning model. Chat-safe: JailbreakBench 1.3%, HarmBench 3.3% (weakest category: cybercrime ~9%)."
  vulnerabilities:
    - "agentic / tool context — same chat->agent gap as the qwen family (a capable model executes injected tasks)"
    - "latent / indirect injection in processed content"
    - "chain-of-thought / reasoning leakage — can reveal guarded content in its thinking"
  resistant_to:
    - "plain direct requests (~1-3%)"
    - "DAN — an earlier garak recon reported ~23%, but garak detectors inflate 2-20x; the real figure is far lower (~2-3%). Treat that 23% as unreliable."
  notes: "Chat-safe like qwen; the earlier garak-based '23% DAN' number is a detector artifact, not a real weakness."

- id: gemma4:31b
  description: "Our usual ATTACKER model. As a TARGET it is markedly weaker than qwen/gpt-oss: JBB 7.5%, HarmBench 13.7%."
  vulnerabilities:
    - "much more jailbreakable in chat than qwen (PAIR semantic reframing ~26%)"
    - "DISINFORMATION is the red thread — HarmBench misinformation 46% (vs qwen 0%)"
  resistant_to:
    - "still resists classic ciphers and GCG suffixes"
  notes: "Good AS AN ATTACKER (generates attacks readily, low refusal). As a target, lean on disinformation + semantic reframing."

- id: gemma4:12b
  description: "Smaller gemma. JBB 9.6%, HarmBench 10.7% (misinformation ~35%)."
  vulnerabilities:
    - "jailbreakable in chat (PAIR ~31%); disinformation weak (~35%)"
  resistant_to:
    - "classic ciphers / GCG"
  notes: "Weaker than qwen; disinformation is the opening. Also usable as an attacker."

- id: qwen3.5-uncensored:9b
  description: "Abliterated/uncensored reference — what 'no safeguards' looks like: JBB 64% ASR, baseline 89%."
  vulnerabilities:
    - "almost everything — safety training removed"
  resistant_to: []
  notes: "Reference point; useful as an ATTACKER model (will not refuse to generate attacks)."

- id: llama3.1:8b
  description: "Chat-safe small model: JailbreakBench 1.8%."
  vulnerabilities:
    - "agentic / latent injection (not measured in the agentic suite here — assume the chat->agent gap applies)"
  resistant_to:
    - "plain direct requests, ciphers, GCG"
  notes: "Chat-safe like the qwen family; agentic profile not measured."
